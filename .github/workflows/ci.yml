name: "Validation"

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend and i18n
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Validate translations
        working-directory: frontend
        run: pnpm check:i18n

      - name: Audit cold-start network boundary
        working-directory: frontend
        run: pnpm check:network-boundary

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

  rust:
    name: Rust fmt, test, and check
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libx11-dev libxtst-dev libxrandr-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@v2.9.1
        with:
          workspaces: ". -> target"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build llama-helper sidecar required by the Tauri manifest
        run: |
          cargo build --release --target x86_64-unknown-linux-gnu -p llama-helper
          mkdir -p frontend/src-tauri/binaries
          cp target/x86_64-unknown-linux-gnu/release/llama-helper frontend/src-tauri/binaries/llama-helper-x86_64-unknown-linux-gnu

      - name: Run Rust tests
        run: cargo test --workspace --lib --bins

      - name: Check all Rust targets
        run: cargo check --workspace --all-targets
