name: "Build and Test - DevTest"

on:
  workflow_dispatch:
    inputs:
      upload-artifacts:
        description: "Upload unsigned build artifacts"
        required: true
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            artifact: mingtily-devtest-macos
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc
            artifact: mingtily-devtest-windows
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu --bundles deb
            artifact: mingtily-devtest-ubuntu-22.04
          - platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu --bundles appimage,rpm
            artifact: mingtily-devtest-ubuntu-24.04

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      asset-prefix: ${{ matrix.artifact }}
      upload-artifacts: ${{ inputs['upload-artifacts'] }}
      is-debug-build: false
