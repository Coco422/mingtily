name: "Release"

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_id: ${{ steps.draft_release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Verify local and release app identities
        run: node frontend/scripts/check-app-identity.mjs

      - name: Match tag and application version
        id: version
        shell: bash
        run: |
          version=$(grep -o '"version": "[^"]*"' frontend/src-tauri/tauri.conf.json | cut -d'"' -f4)
          test "${GITHUB_REF_NAME}" = "v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Require a maintainer-authored draft release
        id: draft_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          release_json=""
          for attempt in 1 2 3 4 5 6; do
            if release_json=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" 2>/dev/null); then
              break
            fi
            sleep 5
          done

          if [[ -z "$release_json" ]]; then
            echo "::error::Create the draft release with an authenticated maintainer account before triggering the tag workflow."
            exit 1
          fi

          if [[ "$(jq -r '.draft' <<< "$release_json")" != "true" ]]; then
            echo "::error::The release must still be a draft when the build starts."
            exit 1
          fi

          if [[ "$(jq -r '.prerelease' <<< "$release_json")" != "false" ]]; then
            echo "::error::The stable release draft must not be marked as a prerelease."
            exit 1
          fi

          release_author=$(jq -r '.author.login' <<< "$release_json")
          release_author_type=$(jq -r '.author.type' <<< "$release_json")
          if [[ "$release_author_type" != "User" || "$release_author" == "github-actions[bot]" ]]; then
            echo "::error::The draft release must be created by a maintainer account so GitHub attributes the release event to that maintainer."
            exit 1
          fi

          echo "Using draft release created by ${release_author}."
          echo "release_id=$(jq -r '.id' <<< "$release_json")" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }} updater release
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --config src-tauri/tauri.release.conf.json
            helper_features: --features metal
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --config src-tauri/tauri.release.conf.json
            helper_features: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2.9.1
        with:
          workspaces: ". -> target"
          key: release-${{ matrix.target }}-v1

      - name: Install Vulkan SDK on Windows
        if: contains(matrix.platform, 'windows')
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Align the Windows static runtime
        if: contains(matrix.platform, 'windows')
        shell: pwsh
        run: |
          "CMAKE_POLICY_DEFAULT_CMP0091=NEW" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_C_FLAGS_RELEASE=/MT /O2 /Ob2 /DNDEBUG" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_CXX_FLAGS_RELEASE=/MT /O2 /Ob2 /DNDEBUG" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS=-C target-feature=+crt-static" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build llama-helper on Windows
        if: contains(matrix.platform, 'windows')
        shell: pwsh
        run: |
          cargo build --release --target "${{ matrix.target }}" -p llama-helper
          New-Item -ItemType Directory -Force -Path "frontend/src-tauri/binaries" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/llama-helper.exe" "frontend/src-tauri/binaries/llama-helper-${{ matrix.target }}.exe"

      - name: Build llama-helper on macOS or Linux
        if: ${{ !contains(matrix.platform, 'windows') }}
        shell: bash
        run: |
          cargo build --release --target "${{ matrix.target }}" -p llama-helper ${{ matrix.helper_features }}
          mkdir -p frontend/src-tauri/binaries
          cp "target/${{ matrix.target }}/release/llama-helper" "frontend/src-tauri/binaries/llama-helper-${{ matrix.target }}"

      - name: Build and upload signed updater artifacts
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: frontend
          releaseId: ${{ needs.validate.outputs.release_id }}
          tagName: v__VERSION__
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          retryAttempts: 5
          args: ${{ matrix.args }}

  publish:
    name: Publish verified release
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - name: Verify updater manifest and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          assets=$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')
          grep -qx 'latest.json' <<< "$assets"
          test "$(grep -c '\.sig$' <<< "$assets")" -ge 2
          manifest_dir=$(mktemp -d)
          trap 'rm -rf "$manifest_dir"' EXIT
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --pattern latest.json --dir "$manifest_dir"
          jq -e '.platforms["darwin-aarch64"].signature | length > 0' "$manifest_dir/latest.json"
          jq -e '.platforms["windows-x86_64"].signature | length > 0' "$manifest_dir/latest.json"
          gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest
