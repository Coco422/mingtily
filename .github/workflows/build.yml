name: "Reusable unsigned build"

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      target:
        required: true
        type: string
      build-args:
        required: false
        type: string
        default: ""
      asset-prefix:
        required: false
        type: string
        default: "mingtily"
      upload-artifacts:
        required: false
        type: boolean
        default: true
      is-debug-build:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ inputs.target }} (unsigned)
    runs-on: ${{ inputs.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Read application version
        id: version
        shell: bash
        run: |
          version=$(grep -o '"version": "[^"]*"' frontend/src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Determine build profile
        id: profile
        shell: bash
        run: |
          if [[ "${{ inputs['is-debug-build'] }}" == "true" ]]; then
            echo "name=debug" >> "$GITHUB_OUTPUT"
          else
            echo "name=release" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2.9.1
        with:
          workspaces: ". -> target"
          key: ${{ inputs.platform }}-${{ inputs.target }}-native-runtime-v5

      - name: Install Linux dependencies
        if: contains(inputs.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libopenblas-dev libx11-dev libxtst-dev libxrandr-dev fuse libfuse2

      - name: Install Vulkan SDK on Windows
        if: contains(inputs.platform, 'windows')
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Select native acceleration
        id: acceleration
        shell: bash
        run: |
          if [[ "${{ inputs.platform }}" == *"windows"* ]]; then
            echo "app=--features vulkan" >> "$GITHUB_OUTPUT"
            echo "helper=" >> "$GITHUB_OUTPUT"
          elif [[ "${{ inputs.platform }}" == *"ubuntu"* ]]; then
            echo "app=--features openblas" >> "$GITHUB_OUTPUT"
            echo "helper=" >> "$GITHUB_OUTPUT"
          else
            echo "app=" >> "$GITHUB_OUTPUT"
            echo "helper=--features metal" >> "$GITHUB_OUTPUT"
          fi

      - name: Align the Windows static runtime
        if: contains(inputs.platform, 'windows')
        shell: pwsh
        run: |
          "CMAKE_POLICY_DEFAULT_CMP0091=NEW" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_C_FLAGS_RELEASE=/MT /O2 /Ob2 /DNDEBUG" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_CXX_FLAGS_RELEASE=/MT /O2 /Ob2 /DNDEBUG" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS=-C target-feature=+crt-static" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build llama-helper on Windows
        if: contains(inputs.platform, 'windows')
        shell: pwsh
        run: |
          cargo build --release --target "${{ inputs.target }}" -p llama-helper
          New-Item -ItemType Directory -Force -Path "frontend/src-tauri/binaries" | Out-Null
          Copy-Item "target/${{ inputs.target }}/release/llama-helper.exe" "frontend/src-tauri/binaries/llama-helper-${{ inputs.target }}.exe"

      - name: Build llama-helper on macOS or Linux
        if: ${{ !contains(inputs.platform, 'windows') }}
        shell: bash
        run: |
          cargo build --release --target "${{ inputs.target }}" -p llama-helper ${{ steps.acceleration.outputs.helper }}
          mkdir -p frontend/src-tauri/binaries
          cp "target/${{ inputs.target }}/release/llama-helper" "frontend/src-tauri/binaries/llama-helper-${{ inputs.target }}"

      - name: Cache FFmpeg sidecar
        uses: actions/cache@v6.1.0
        with:
          path: frontend/src-tauri/binaries/ffmpeg-*
          key: ${{ runner.os }}-${{ inputs.target }}-ffmpeg-${{ hashFiles('frontend/src-tauri/build.rs', 'frontend/src-tauri/build/ffmpeg.rs') }}

      - name: Build Tauri application
        uses: tauri-apps/tauri-action@v1.0.0
        with:
          projectPath: frontend
          args: ${{ inputs['build-args'] }} ${{ steps.acceleration.outputs.app }}

      - name: Repack AppImage without bundled libwayland-client
        if: contains(inputs.platform, 'ubuntu')
        shell: bash
        run: |
          bundle_root="target/${{ inputs.target }}/${{ steps.profile.outputs.name }}/bundle"
          appimage_path=$(find "$bundle_root/appimage" -name '*.AppImage' -type f 2>/dev/null | head -1 || true)
          if [[ -z "$appimage_path" ]]; then
            exit 0
          fi

          appimage_dir=$(dirname "$appimage_path")
          appimage_name=$(basename "$appimage_path")
          cd "$appimage_dir"
          chmod +x "$appimage_name"
          "./$appimage_name" --appimage-extract
          find squashfs-root -name 'libwayland-client.so*' -type f -delete
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --no-appstream squashfs-root "$appimage_name"
          rm -rf squashfs-root appimagetool-x86_64.AppImage

      - name: Verify bundle output
        shell: bash
        run: |
          bundle_root="target/${{ inputs.target }}/${{ steps.profile.outputs.name }}/bundle"
          test -d "$bundle_root"
          find "$bundle_root" -type f

      - name: Upload unsigned artifacts
        if: inputs['upload-artifacts']
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ inputs['asset-prefix'] }}-${{ inputs.target }}-${{ steps.profile.outputs.name }}-${{ steps.version.outputs.version }}
          path: |
            target/${{ inputs.target }}/${{ steps.profile.outputs.name }}/bundle/dmg/*.dmg
            target/${{ inputs.target }}/${{ steps.profile.outputs.name }}/bundle/macos/*.app
            target/${{ inputs.target }}/${{ steps.profile.outputs.name }}/bundle/msi/*.msi
            target/${{ inputs.target }}/${{ steps.profile.outputs.name }}/bundle/nsis/*.exe
            target/${{ inputs.target }}/${{ steps.profile.outputs.name }}/bundle/deb/*.deb
            target/${{ inputs.target }}/${{ steps.profile.outputs.name }}/bundle/appimage/*.AppImage
            target/${{ inputs.target }}/${{ steps.profile.outputs.name }}/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 30

      - name: Write build summary
        shell: bash
        run: |
          echo "## Mingtily unsigned build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: ${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Platform: ${{ inputs.platform }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: ${{ inputs.target }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Profile: ${{ steps.profile.outputs.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Signing: not configured" >> "$GITHUB_STEP_SUMMARY"
